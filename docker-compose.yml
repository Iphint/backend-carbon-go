services:
  mysql:
    image: mysql:8.0
    container_name: carbon-go-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carbon_go
    ports:
      - "33306:3306"
    volumes:
      - carbon_go_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: carbon-go-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 128M
    ports:
      - "8080:80"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon-go-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-https://carbongo.site}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://admin.carbongo.site}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://carbongo.site,https://www.carbongo.site,https://admin.carbongo.site}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: carbon_go
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "5001:5000"
    volumes:
      - ./database:/app/database:ro
    command: sh -c "npm start"

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: carbon-go-translate
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      - LT_LOAD_ONLY=en,id
      - LT_MAX_LENGTH=500
      - LT_THREADS=1

volumes:
  carbon_go_mysql_data: